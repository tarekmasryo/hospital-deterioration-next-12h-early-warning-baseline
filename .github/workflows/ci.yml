name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  
jobs:
  repo-integrity:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Run repository integrity tests
        run: |
          python -m pytest -q
